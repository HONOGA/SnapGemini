<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Camera Outer Ring with Neon Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#geminiGrad)" stroke-width="28" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#geminiGrad)" stroke-width="28"/>
  
  <!-- Inner Lens Glass -->
  <circle cx="256" cy="256" r="120" fill="#111827" opacity="0.8"/>
  <circle cx="256" cy="256" r="90" fill="#1e293b" opacity="0.6"/>

  <!-- AI Gemini 4-Point Star Sparkle -->
  <path d="M 256 160 Q 256 256 352 256 Q 256 256 256 352 Q 256 256 160 256 Q 256 256 256 160 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 256 160 Q 256 256 352 256 Q 256 256 256 352 Q 256 256 160 256 Q 256 256 256 160 Z" fill="#ffffff"/>

  <!-- Aperture Accent Dot -->
  <circle cx="340" cy="180" r="12" fill="#38bdf8" filter="url(#glow)"/>
</svg>
