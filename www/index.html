<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SnapGemini - 一鍵拍照直達 Gemini AI 視覺深度分析，極速解讀萬物、文字 OCR、翻譯、解題與熱量分析">
  <title>SnapGemini - 即拍即問 AI 相機</title>
  
  <!-- Manifest for PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- External Libraries (Marked for Markdown, Lucide Icons) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- 頂部頂欄 (Top Bar / HUD) -->
    <header class="top-hud">
      <div class="brand">
        <div class="logo-badge">
          <i data-lucide="sparkles" class="logo-icon"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">SnapGemini</span>
          <span class="model-badge" id="active-model-tag">Gemini 3.6 Flash</span>
        </div>
      </div>
      
      <div class="hud-actions">
        <button id="btn-flash" class="hud-btn" title="閃光燈/手電筒" aria-label="Toggle Flashlight">
          <i data-lucide="zap-off" id="icon-flash"></i>
        </button>
        <button id="btn-flip" class="hud-btn" title="切換前後鏡頭" aria-label="Switch Camera">
          <i data-lucide="refresh-cw"></i>
        </button>
        <button id="btn-history" class="hud-btn" title="歷史紀錄" aria-label="History">
          <i data-lucide="history"></i>
        </button>
        <button id="btn-settings" class="hud-btn" title="API 設定" aria-label="Settings">
          <i data-lucide="settings"></i>
        </button>
      </div>
    </header>

    <!-- 相機取景主區域 (Camera Viewport) -->
    <main class="camera-viewport" id="camera-viewport">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="capture-canvas" style="display: none;"></canvas>

      <!-- 拍照 HUD 輔助線與焦點框 -->
      <div class="viewfinder-overlay">
        <div class="focus-bracket top-left"></div>
        <div class="focus-bracket top-right"></div>
        <div class="focus-bracket bottom-left"></div>
        <div class="focus-bracket bottom-right"></div>
        <div class="grid-line horizontal-1"></div>
        <div class="grid-line horizontal-2"></div>
        <div class="grid-line vertical-1"></div>
        <div class="grid-line vertical-2"></div>
        <div class="center-target"></div>
      </div>

      <!-- 鏡頭載入中提示 -->
      <div id="camera-loading" class="camera-state-overlay">
        <div class="spinner"></div>
        <p>正在啟動鏡頭...</p>
      </div>

      <!-- 鏡頭權限錯誤或無法存取提示 -->
      <div id="camera-error" class="camera-state-overlay" style="display: none;">
        <i data-lucide="camera-off" class="state-icon"></i>
        <h3>無法存取鏡頭</h3>
        <p id="camera-error-msg">請允許瀏覽器存取相機權限，或使用照片上傳功能。</p>
        <div class="error-actions">
          <button id="btn-retry-camera" class="btn-primary-sm">重試鏡頭</button>
          <label for="fallback-file-input" class="btn-secondary-sm">
            <i data-lucide="image"></i> 從相簿選取
          </label>
        </div>
      </div>
    </main>

    <!-- 底部控制區域 (Bottom Control Area) -->
    <footer class="bottom-control-hub">
      <!-- 模式滾動選擇器 (Mode Selector Pills) -->
      <div class="mode-selector-wrapper">
        <div class="mode-selector" id="mode-selector">
          <button class="mode-pill active" data-mode="identify">
            <i data-lucide="scan-search"></i>
            <span>萬物解讀</span>
          </button>
          <button class="mode-pill" data-mode="ocr">
            <i data-lucide="file-text"></i>
            <span>文字提取</span>
          </button>
          <button class="mode-pill" data-mode="translate">
            <i data-lucide="languages"></i>
            <span>翻成繁中</span>
          </button>
          <button class="mode-pill" data-mode="solve">
            <i data-lucide="help-circle"></i>
            <span>解題解答</span>
          </button>
          <button class="mode-pill" data-mode="nutrition">
            <i data-lucide="utensils"></i>
            <span>飲食熱量</span>
          </button>
          <button class="mode-pill" data-mode="custom">
            <i data-lucide="message-square-plus"></i>
            <span>自訂提問</span>
          </button>
        </div>
      </div>

      <!-- 自訂問題輸入條（當選中自訂提問時顯示） -->
      <div id="custom-prompt-container" class="custom-prompt-bar" style="display: none;">
        <input type="text" id="custom-prompt-input" placeholder="輸入你想問 Gemini 的問題..." />
        <button id="btn-voice-input" class="btn-icon" title="語音輸入"><i data-lucide="mic"></i></button>
      </div>

      <!-- 快門操控列 (Shutter Row) -->
      <div class="shutter-row">
        <!-- 左側：相簿選取 -->
        <label for="file-input" class="action-circle-btn" title="從相簿選照片">
          <i data-lucide="image"></i>
          <input type="file" id="file-input" accept="image/*" style="display: none;">
        </label>
        <input type="file" id="fallback-file-input" accept="image/*" style="display: none;">

        <!-- 中間：主快門按鈕 (Large Shutter Button) -->
        <button id="btn-shutter" class="shutter-button" aria-label="拍照並分析">
          <div class="shutter-inner">
            <i data-lucide="sparkles" class="shutter-icon"></i>
          </div>
          <div class="shutter-ring"></div>
        </button>

        <!-- 右側：自訂提問/設定快速開關 -->
        <button id="btn-toggle-custom" class="action-circle-btn" title="切換自訂問題">
          <i data-lucide="message-square"></i>
        </button>
      </div>
    </footer>

    <!-- 分析結果浮動抽屜 (Analysis Result Bottom Sheet) -->
    <div id="result-sheet" class="bottom-sheet">
      <div class="sheet-scrim" id="sheet-scrim"></div>
      <div class="sheet-panel">
        <!-- 頂部拉桿與控制列 -->
        <div class="sheet-handle-bar">
          <div class="sheet-handle"></div>
        </div>
        
        <div class="sheet-header">
          <div class="sheet-title-info">
            <span class="sheet-mode-tag" id="sheet-mode-tag">萬物解讀</span>
            <span class="sheet-time" id="sheet-time">剛剛</span>
          </div>
          <div class="sheet-actions">
            <button id="btn-tts" class="sheet-action-btn" title="語音朗讀" aria-label="朗讀">
              <i data-lucide="volume-2" id="icon-tts"></i>
            </button>
            <button id="btn-copy" class="sheet-action-btn" title="複製內容" aria-label="複製">
              <i data-lucide="copy" id="icon-copy"></i>
            </button>
            <button id="btn-close-sheet" class="sheet-action-btn" title="關閉" aria-label="關閉">
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>

        <!-- 內容滾動區 -->
        <div class="sheet-content" id="sheet-content">
          <!-- 縮圖預覽 -->
          <div class="captured-preview-container">
            <img id="captured-preview-img" src="" alt="拍攝的照片" />
            <div id="analysis-status-pill" class="status-pill status-loading">
              <div class="pulse-dot"></div>
              <span id="status-text">Gemini 分析中...</span>
            </div>
          </div>

          <!-- 分析 Markdown 文字輸出區 -->
          <div class="analysis-output" id="analysis-output">
            <div class="loading-placeholder">
              <div class="shimmer-line title"></div>
              <div class="shimmer-line text"></div>
              <div class="shimmer-line text short"></div>
              <div class="shimmer-line text"></div>
            </div>
          </div>

          <!-- 追問輸入區 (Follow-up conversation) -->
          <div class="followup-container" id="followup-container" style="display: none;">
            <div class="followup-input-wrapper">
              <input type="text" id="followup-input" placeholder="繼續針對這張照片追問..." />
              <button id="btn-followup-send" class="btn-send"><i data-lucide="send"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 設定彈窗 (Settings Modal) -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <i data-lucide="key" class="title-icon"></i>
            <h3>Gemini API 設定</h3>
          </div>
          <button id="btn-close-settings" class="btn-icon"><i data-lucide="x"></i></button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="input-api-key">Gemini API Key <span class="required">*</span></label>
            <div class="input-with-icon">
              <input type="password" id="input-api-key" placeholder="貼上你的 API Key (AIzaSy...)" autocomplete="off" />
              <button type="button" id="btn-toggle-key-vis" class="icon-suffix"><i data-lucide="eye"></i></button>
            </div>
            <p class="form-help">
              Key 只會儲存在您手機本地瀏覽器（localStorage），直接呼叫 Google 官方，不經第三方伺服器。
              <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">免費獲取 Key ↗</a>
            </p>
          </div>

          <div class="form-group">
            <label for="select-model">AI 模型選擇</label>
            <select id="select-model" class="custom-select">
              <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash（極速旗艦、最新推薦 ⭐）</option>
              <option value="gemini-3.7-flash">Gemini 3.7 Flash（超強多模態視覺）</option>
              <option value="gemini-3.0-flash">Gemini 3.0 Flash（新世代基礎模型）</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash（穩定多模態）</option>
              <option value="gemini-2.5-pro">Gemini 2.5 Pro（深度推理最強）</option>
            </select>
          </div>

          <div class="form-group">
            <label for="select-image-quality">圖片解析度壓縮</label>
            <select id="select-image-quality" class="custom-select">
              <option value="1280" selected>極速 (1280px - 手機最流暢推薦)</option>
              <option value="1920">清晰 (1920px - 適合細小文字 OCR)</option>
              <option value="800">省流量 (800px)</option>
            </select>
          </div>

          <div class="form-group toggle-group">
            <div class="toggle-info">
              <span class="toggle-label">拍照音效與震動反饋</span>
              <span class="toggle-desc">按下快門時震動與播放輕脆快門聲</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="check-haptics" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <div class="form-group toggle-group">
            <div class="toggle-info">
              <span class="toggle-label">自動中文語音朗讀</span>
              <span class="toggle-desc">Gemini 分析完畢後自動用中文朗讀重點</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="check-auto-tts">
              <span class="slider round"></span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button id="btn-save-settings" class="btn-primary-block">儲存設定</button>
        </div>
      </div>
    </div>

    <!-- 歷史紀錄側邊/底層抽屜 (History Drawer) -->
    <div id="history-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card history-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <i data-lucide="history" class="title-icon"></i>
            <h3>拍攝歷史紀錄</h3>
          </div>
          <div class="modal-header-actions">
            <button id="btn-clear-history" class="btn-text-danger" title="清空紀錄">清空</button>
            <button id="btn-close-history" class="btn-icon"><i data-lucide="x"></i></button>
          </div>
        </div>
        <div class="modal-body history-body" id="history-list">
          <!-- 動態插入歷史列表 -->
        </div>
      </div>
    </div>

    <!-- 吐司提示訊息 (Toast Notification) -->
    <div id="toast" class="toast-container" style="display: none;">
      <i data-lucide="info" id="toast-icon"></i>
      <span id="toast-message">提示訊息</span>
    </div>

  </div>

  <!-- JavaScript 模組 -->
  <script src="js/icons.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 註冊 Service Worker 支援 PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SnapGemini ServiceWorker 註冊成功:', reg.scope))
          .catch(err => console.log('ServiceWorker 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
